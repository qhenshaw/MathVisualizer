<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vector Lab</title>
<meta name="description" content="Interactive, animated explainer for vector math: directions, normalization, dot and cross products, lerp, slerp, inverse lerp, gimbal lock and quaternions.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E1117'/%3E%3Cpath d='M7 25 L24 8' stroke='%23F06FB0' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M15 8 H24 V17' fill='none' stroke='%23F06FB0' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0E1117}
a{color:#5AB8F5}a:hover{color:#8FD0FA}
input[type=range]{accent-color:#F06FB0;width:100%;height:28px;margin:0;cursor:pointer}
button{font-family:inherit}
button:focus-visible{outline:2px solid #F06FB0;outline-offset:2px}
</style>
</head>
<body>
<div id="app"><p style="font-family: system-ui, sans-serif; color: #B4BDCC; padding: 32px">Loading Vector Lab…</p></div>
<template id="dc-template">
<div style="min-height: 100vh; background: #0E1117; color: #E6EAF2; font-family: 'Space Grotesk', system-ui, sans-serif; padding: 32px 20px 48px; box-sizing: border-box">
<div style="max-width: 1360px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 760px">
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #F06FB0">Interactive primer · 2D &amp; 3D vector math</p>
<h1 style="margin: 0; font-size: 44px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; color: #F2F4F8">Vector Lab</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #B4BDCC">Nine core ideas behind every game engine, shader and animation rig. Drag the handles, scrub the sliders, and watch the numbers follow.</p>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button type="button" onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: #F06FB0; color: #0E1117; font-size: 15px; font-weight: 600; cursor: pointer">
<sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="#0E1117"></rect><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="#0E1117"></rect></svg>
</sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{false}}">
<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="#0E1117"></path></svg>
</sc-if>
<span>{{playText}}</span>
</button>
<button type="button" onClick="{{reset}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #2E3748; background: transparent; color: #E6EAF2; font-size: 15px; font-weight: 500; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#E6EAF2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4"></path><path d="M2.5 2.5v3h3"></path></svg>
<span>Reset</span>
</button>
</div>
</header>

<nav aria-label="Topics" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="8">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; font-size: 14px; font-weight: 600; cursor: pointer">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; opacity: 0.75">{{t.num}}</span>
<span>{{t.label}}</span>
</button>
</sc-for>
</nav>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">

<section aria-label="Visualization" style="flex: 3 1 560px; min-width: 0; background: #131824; border: 1px solid #232B3A; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 2px 6px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #E6EAF2">{{stageTitle}}</span>
<span style="font-size: 13px; color: #A3ADBF">{{hint}}</span>
</div>
<svg viewBox="0 0 640 480" role="img" aria-label="{{stageTitle}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerCancel="{{onUp}}" style="width: 100%; height: auto; display: block; touch-action: none; border-radius: 10px; font-family: 'JetBrains Mono', monospace; user-select: none">
<rect x="0" y="0" width="640" height="480" fill="#0B0F16"></rect>
<sc-for list="{{scene.grid}}" as="g" hint-placeholder-count="0"><line x1="{{g.x1}}" y1="{{g.y1}}" x2="{{g.x2}}" y2="{{g.y2}}" stroke="{{g.stroke}}" stroke-width="{{g.sw}}"></line></sc-for>
<sc-for list="{{scene.polys}}" as="p" hint-placeholder-count="0"><polygon points="{{p.pts}}" fill="{{p.fill}}" fill-opacity="{{p.fop}}" stroke="{{p.stroke}}" stroke-width="{{p.sw}}" stroke-linejoin="round"></polygon></sc-for>
<sc-for list="{{scene.rings}}" as="c" hint-placeholder-count="0"><circle cx="{{c.cx}}" cy="{{c.cy}}" r="{{c.r}}" fill="none" stroke="{{c.stroke}}" stroke-width="{{c.sw}}" stroke-dasharray="{{c.dash}}" opacity="{{c.op}}"></circle></sc-for>
<sc-for list="{{scene.paths}}" as="p" hint-placeholder-count="0"><path d="{{p.d}}" fill="none" stroke="{{p.stroke}}" stroke-width="{{p.sw}}" stroke-dasharray="{{p.dash}}" opacity="{{p.op}}" stroke-linecap="round"></path></sc-for>
<sc-for list="{{scene.lines}}" as="l" hint-placeholder-count="0"><line x1="{{l.x1}}" y1="{{l.y1}}" x2="{{l.x2}}" y2="{{l.y2}}" stroke="{{l.stroke}}" stroke-width="{{l.sw}}" stroke-dasharray="{{l.dash}}" opacity="{{l.op}}" stroke-linecap="round"></line></sc-for>
<sc-for list="{{scene.arrows}}" as="a" hint-placeholder-count="0"><g opacity="{{a.op}}"><line x1="{{a.x1}}" y1="{{a.y1}}" x2="{{a.x2}}" y2="{{a.y2}}" stroke="{{a.stroke}}" stroke-width="{{a.sw}}" stroke-linecap="round"></line><polygon points="{{a.pts}}" fill="{{a.stroke}}" stroke="{{a.stroke}}" stroke-width="1" stroke-linejoin="round"></polygon></g></sc-for>
<sc-for list="{{scene.dots}}" as="d" hint-placeholder-count="0"><circle cx="{{d.cx}}" cy="{{d.cy}}" r="{{d.r}}" fill="{{d.fill}}" stroke="{{d.stroke}}" stroke-width="{{d.sw}}"></circle></sc-for>
<sc-for list="{{scene.labels}}" as="t" hint-placeholder-count="0"><text x="{{t.x}}" y="{{t.y}}" fill="{{t.fill}}" font-size="{{t.size}}" font-weight="{{t.weight}}" text-anchor="{{t.anchor}}" stroke="#0B0F16" stroke-width="4" stroke-linejoin="round" paint-order="stroke">{{t.text}}</text></sc-for>
<sc-for list="{{scene.handles}}" as="h" hint-placeholder-count="0"><g onPointerDown="{{h.down}}" style="cursor: grab"><circle cx="{{h.cx}}" cy="{{h.cy}}" r="22" fill="#FFFFFF" fill-opacity="0.001"></circle><circle cx="{{h.cx}}" cy="{{h.cy}}" r="14" fill="{{h.fill}}" fill-opacity="0.18"></circle><circle cx="{{h.cx}}" cy="{{h.cy}}" r="7" fill="{{h.fill}}" stroke="#0B0F16" stroke-width="2.5"></circle></g></sc-for>
</svg>
<sc-if value="{{is.dot}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 640 76" role="img" aria-label="Dot product result on a scale from minus 1 to 1" style="width: 100%; height: auto; display: block; font-family: 'JetBrains Mono', monospace">
<rect x="0" y="0" width="640" height="76" rx="10" fill="#0B0F16"></rect>
<line x1="40" y1="40" x2="600" y2="40" stroke="#2E3748" stroke-width="2"></line>
<line x1="40" y1="34" x2="40" y2="46" stroke="#4A556B" stroke-width="1.5"></line>
<line x1="180" y1="36" x2="180" y2="44" stroke="#4A556B" stroke-width="1.5"></line>
<line x1="320" y1="30" x2="320" y2="50" stroke="#4A556B" stroke-width="1.5"></line>
<line x1="460" y1="36" x2="460" y2="44" stroke="#4A556B" stroke-width="1.5"></line>
<line x1="600" y1="34" x2="600" y2="46" stroke="#4A556B" stroke-width="1.5"></line>
<text x="40" y="66" text-anchor="middle" fill="#8C97AB" font-size="11">−1</text>
<text x="180" y="66" text-anchor="middle" fill="#8C97AB" font-size="11">−0.5</text>
<text x="320" y="66" text-anchor="middle" fill="#8C97AB" font-size="11">0</text>
<text x="460" y="66" text-anchor="middle" fill="#8C97AB" font-size="11">0.5</text>
<text x="600" y="66" text-anchor="middle" fill="#8C97AB" font-size="11">1</text>
<sc-if value="{{r.hasOut}}" hint-placeholder-val="{{false}}"><line x1="320" y1="40" x2="{{r.outX2}}" y2="40" stroke="{{r.barColor}}" stroke-width="8" stroke-linecap="round"></line></sc-if>
<text x="{{r.outX}}" y="20" text-anchor="middle" fill="{{r.barColor}}" font-size="14" font-weight="600">A · B = {{r.dot}}</text>
</svg>
</sc-if>
<sc-if value="{{is.inv}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 640 76" role="img" aria-label="Inverse lerp result on a scale from 0 to 1" style="width: 100%; height: auto; display: block; font-family: 'JetBrains Mono', monospace">
<rect x="0" y="0" width="640" height="76" rx="10" fill="#0B0F16"></rect>
<line x1="40" y1="40" x2="600" y2="40" stroke="#2E3748" stroke-width="2"></line>
<line x1="40" y1="32" x2="40" y2="48" stroke="#F5B83D" stroke-width="2"></line>
<line x1="180" y1="36" x2="180" y2="44" stroke="#4A556B" stroke-width="1.5"></line>
<line x1="320" y1="34" x2="320" y2="46" stroke="#4A556B" stroke-width="1.5"></line>
<line x1="460" y1="36" x2="460" y2="44" stroke="#4A556B" stroke-width="1.5"></line>
<line x1="600" y1="32" x2="600" y2="48" stroke="#5AB8F5" stroke-width="2"></line>
<text x="40" y="66" text-anchor="middle" fill="#F5B83D" font-size="11">0 · A</text>
<text x="180" y="66" text-anchor="middle" fill="#8C97AB" font-size="11">0.25</text>
<text x="320" y="66" text-anchor="middle" fill="#8C97AB" font-size="11">0.5</text>
<text x="460" y="66" text-anchor="middle" fill="#8C97AB" font-size="11">0.75</text>
<text x="600" y="66" text-anchor="middle" fill="#5AB8F5" font-size="11">1 · B</text>
<line x1="40" y1="40" x2="{{r.stripX}}" y2="40" stroke="#5EE0A8" stroke-width="8" stroke-linecap="round"></line>
<circle cx="{{r.stripX}}" cy="40" r="7" fill="#F06FB0" stroke="#F2F4F8" stroke-width="2"></circle>
<text x="{{r.stripLabelX}}" y="20" text-anchor="middle" fill="#5EE0A8" font-size="14" font-weight="600">t = {{r.t}}</text>
</svg>
</sc-if>
</section>

<aside aria-label="Explanation" style="flex: 2 1 340px; min-width: 0; background: #131824; border: 1px solid #232B3A; border-radius: 16px; padding: 24px; box-sizing: border-box">

<sc-if value="{{is.dir}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #F06FB0">01 · Vector directions</p>
<h2 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; color: #F2F4F8">To aim at the enemy, subtract the player</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #B4BDCC">The player stands at P and the enemy at Q. Q − P gives the offset d (dashed): its length is how far away the enemy is. Dividing d by its length gives the direction (green arrow): a unit vector, always length 1, that only says which way to face. Multiply it by a speed and you get movement toward the enemy that does not depend on how far away they are.</p>
</div>
<div style="margin: 0; padding: 14px 16px; background: #0B0F16; border: 1px solid #232B3A; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.75; color: #E6EAF2; white-space: pre-line">d = Q − P = (Qx − Px, Qy − Py)
|d| = √(dx² + dy²)
dir = d / |d|      |dir| = 1
θ = atan2(dy, dx)</div>
<div style="display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">Player P</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.P}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">Enemy Q</span><span style="font-family: 'JetBrains Mono', monospace; color: #F5B83D">{{r.Q}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">d = Q − P</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.d}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">Distance to enemy |d|</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.len}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">Direction d / |d|</span><span style="font-family: 'JetBrains Mono', monospace; color: #5EE0A8; font-weight: 600">{{r.dir}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">Heading θ</span><span style="font-family: 'JetBrains Mono', monospace; color: #F06FB0">{{r.ang}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px"><span style="color: #A3ADBF">Compass</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.compass}}</span></div>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.55; color: #A3ADBF"><strong style="color: #E6EAF2; font-weight: 600">Used for</strong> aiming at a target, steering, line-of-sight checks, velocity and knockback directions.</p>
</div>
</sc-if>

<sc-if value="{{is.norm}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #F06FB0">02 · Normalization</p>
<h2 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; color: #F2F4F8">Keep the direction, throw away the length</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #B4BDCC">Dividing a vector by its own length shrinks or stretches it onto the unit circle. The result n is a unit vector: length exactly 1, pointing the same way.</p>
</div>
<div style="margin: 0; padding: 14px 16px; background: #0B0F16; border: 1px solid #232B3A; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.75; color: #E6EAF2; white-space: pre-line">|v| = √(vx² + vy²)
n = v / |v| = (vx / |v|, vy / |v|)
|n| = 1</div>
<div style="display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">v</span><span style="font-family: 'JetBrains Mono', monospace; color: #F5B83D">{{r.v}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">Length |v|</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.len}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">n = v / |v|</span><span style="font-family: 'JetBrains Mono', monospace; color: #5EE0A8">{{r.n}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px"><span style="color: #A3ADBF">Length |n|</span><span style="font-family: 'JetBrains Mono', monospace; color: #5EE0A8">{{r.nlen}}</span></div>
</div>
<sc-if value="{{r.zero}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 12px 14px; border-radius: 10px; background: #2A1A22; color: #F7B6D3; font-size: 14px; line-height: 1.5">The zero vector has no direction, so it cannot be normalized. Real code checks |v| against a small epsilon before dividing.</p>
</sc-if>
<p style="margin: 0; font-size: 13px; line-height: 1.55; color: #A3ADBF"><strong style="color: #E6EAF2; font-weight: 600">Used for</strong> movement at constant speed regardless of input length, surface normals for lighting, and any formula that expects pure direction.</p>
</div>
</sc-if>

<sc-if value="{{is.dot}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #F06FB0">03 · Dot product</p>
<h2 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; color: #F2F4F8">How much do two vectors agree?</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #B4BDCC">The dot product multiplies matching components and adds them up. Here A and B are normalized (length 1, on the dashed unit circle), so the dot product is exactly cos θ: the length of B’s shadow on A, where the dashed line meets A’s line. The scale below the graph shows the result, green when positive and pink when negative. Positive means they point the same way, zero means perpendicular, negative means opposed.</p>
</div>
<div style="margin: 0; padding: 14px 16px; background: #0B0F16; border: 1px solid #232B3A; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.75; color: #E6EAF2; white-space: pre-line">A · B = Ax·Bx + Ay·By
A · B = |A| |B| cos θ
|A| = |B| = 1  →  A · B = cos θ
proj = (A · B) A</div>
<div style="display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">A · B</span><span style="font-family: 'JetBrains Mono', monospace; color: #B4BDCC; text-align: right">{{r.expr}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">Result</span><span style="font-family: 'JetBrains Mono', monospace; color: {{r.barColor}}; font-weight: 600">{{r.dot}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">|A| · |B|</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.lens}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px"><span style="color: #A3ADBF">Angle θ</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.theta}}</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #A3ADBF"><span>cos θ = Â · B̂</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.cos}}</span></div>
<div style="position: relative; height: 14px; border-radius: 7px; background: #0B0F16; border: 1px solid #232B3A">
<div style="position: absolute; left: 50%; top: -3px; width: 1px; height: 20px; background: #4A556B"></div>
<div style="position: absolute; top: 1px; left: {{r.barLeft}}%; width: {{r.barW}}%; height: 12px; border-radius: 6px; background: {{r.barColor}}"></div>
</div>
<div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8C97AB"><span>−1 opposite</span><span>0 perpendicular</span><span>+1 same</span></div>
<p style="margin: 0; font-size: 15px; font-weight: 600; color: {{r.barColor}}">{{r.verdict}}</p>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.55; color: #A3ADBF"><strong style="color: #E6EAF2; font-weight: 600">Used for</strong> “is the enemy in front of me?”, field-of-view cones, diffuse lighting (N · L), projecting velocity onto a slope.</p>
</div>
</sc-if>

<sc-if value="{{is.cross}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #F06FB0">04 · Cross product</p>
<h2 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; color: #F2F4F8">A new vector, perpendicular to both</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #B4BDCC">In 3D, A × B points straight out of the plane that A and B span, following the right-hand rule. Its length equals the area of the parallelogram they make, so it shrinks to zero when A and B line up. Order matters: B × A flips it. With unit vectors A and B, the length is simply sin θ.</p>
</div>
<div style="margin: 0; padding: 14px 16px; background: #0B0F16; border: 1px solid #232B3A; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.75; color: #E6EAF2; white-space: pre-line">A × B = (AyBz − AzBy,
         AzBx − AxBz,
         AxBy − AyBx)
|A × B| = |A| |B| sin θ
|A| = |B| = 1  →  |A × B| = sin θ</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #A3ADBF">A and B are normalized (length 1). Drag their tips to turn them around the floor; use the sliders to tilt them up or down.</p>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #A3ADBF"><span style="display: flex; justify-content: space-between"><span>Elevation of A</span><span style="font-family: 'JetBrains Mono', monospace; color: #F5B83D">{{r.az}}</span></span><input type="range" min="-80" max="80" step="1" value="{{r.azVal}}" onChange="{{set.crossAz}}"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #A3ADBF"><span style="display: flex; justify-content: space-between"><span>Elevation of B</span><span style="font-family: 'JetBrains Mono', monospace; color: #5AB8F5">{{r.bz}}</span></span><input type="range" min="-80" max="80" step="1" value="{{r.bzVal}}" onChange="{{set.crossBz}}"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #A3ADBF"><span style="display: flex; justify-content: space-between"><span>View angle</span><span style="font-family: 'JetBrains Mono', monospace; color: #E6EAF2">{{r.yawIn}}</span></span><input type="range" min="-180" max="180" step="1" value="{{r.yawVal}}" onChange="{{set.crossYaw}}"></label>
<button type="button" onClick="{{swapCross}}" style="align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #2E3748; background: #1A2030; color: #E6EAF2; font-size: 14px; font-weight: 600; cursor: pointer">Swap order → {{r.swapTo}}</button>
</div>
<div style="display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">A</span><span style="font-family: 'JetBrains Mono', monospace; color: #F5B83D">{{r.A}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">B</span><span style="font-family: 'JetBrains Mono', monospace; color: #5AB8F5">{{r.B}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">{{r.name}}</span><span style="font-family: 'JetBrains Mono', monospace; color: #F06FB0; font-weight: 600">{{r.C}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">Angle between</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.angle}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px"><span style="color: #A3ADBF">Length = parallelogram area</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.area}}</span></div>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.55; color: #A3ADBF"><strong style="color: #E6EAF2; font-weight: 600">Used for</strong> surface normals from two triangle edges, building a camera’s right/up axes, torque, and telling left from right (sign of the z-component in 2D).</p>
</div>
</sc-if>

<sc-if value="{{is.lerp}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #F06FB0">05 · Lerp</p>
<h2 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; color: #F2F4F8">Linear interpolation: a slider between two values</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #B4BDCC">Lerp blends A into B by a fraction t. At t = 0 you get A, at t = 1 you get B, and everything in between lies on the straight line joining them. It works on numbers, points and colors alike. The small dots mark t = 0, 0.1, … 1; switch on smoothstep to see easing bunch them up at the ends.</p>
</div>
<div style="margin: 0; padding: 14px 16px; background: #0B0F16; border: 1px solid #232B3A; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.75; color: #E6EAF2; white-space: pre-line">lerp(A, B, t) = A + (B − A) · t
             = (1 − t) · A + t · B</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #A3ADBF"><span style="display: flex; justify-content: space-between"><span>t</span><span style="font-family: 'JetBrains Mono', monospace; color: #F06FB0">{{r.t}}</span></span><input type="range" min="0" max="1" step="0.01" value="{{r.tVal}}" onChange="{{set.lerpT}}"></label>
<div role="group" aria-label="Easing" style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" onClick="{{easeLinear}}" aria-pressed="{{r.linPressed}}" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid {{r.linBd}}; background: {{r.linBg}}; color: {{r.linFg}}; font-size: 14px; font-weight: 600; cursor: pointer">Linear t</button>
<button type="button" onClick="{{easeSmooth}}" aria-pressed="{{r.smPressed}}" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid {{r.smBd}}; background: {{r.smBg}}; color: {{r.smFg}}; font-size: 14px; font-weight: 600; cursor: pointer">Smoothstep t² (3 − 2t)</button>
</div>
</div>
<div style="display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">A · B</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.AB}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">t used (after easing)</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.te}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">P = lerp(A, B, t)</span><span style="font-family: 'JetBrains Mono', monospace; color: #F06FB0; font-weight: 600">{{r.P}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px"><span style="color: #A3ADBF">lerp(0, 100, t)</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.num}}</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #A3ADBF">The same t applied to color, per RGB channel</span>
<div style="position: relative; height: 36px; border-radius: 8px; background: linear-gradient(90deg, #F5B83D, #5AB8F5)">
<div style="position: absolute; top: -4px; left: {{r.pct}}%; width: 4px; height: 44px; margin-left: -2px; border-radius: 2px; background: #F2F4F8"></div>
</div>
<div style="display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #F2F4F8"><span style="width: 22px; height: 22px; border-radius: 6px; border: 1px solid #2E3748; background: {{r.color}}"></span><span>{{r.color}}</span></div>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.55; color: #A3ADBF"><strong style="color: #E6EAF2; font-weight: 600">Used for</strong> tweening UI and cameras, blending colors, health-bar fills, smoothing (x = lerp(x, target, k) each frame).</p>
</div>
</sc-if>

<sc-if value="{{is.slerp}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #F06FB0">06 · Slerp</p>
<h2 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; color: #F2F4F8">Spherical lerp: travel along the arc, not the chord</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #B4BDCC">Lerping two unit vectors cuts straight across the circle (grey chord), so the result gets shorter in the middle. Slerp instead rotates at a constant angular rate along the shortest arc and stays length 1 the whole way. The pink ticks mark t = 0.1, 0.2, … and sit evenly spaced along the arc.</p>
</div>
<div style="margin: 0; padding: 14px 16px; background: #0B0F16; border: 1px solid #232B3A; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.75; color: #E6EAF2; white-space: pre-line">Ω = acos(A · B)
slerp(A, B, t) = sin((1 − t)Ω) / sin Ω · A
               + sin(tΩ) / sin Ω · B</div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #A3ADBF"><span style="display: flex; justify-content: space-between"><span>t</span><span style="font-family: 'JetBrains Mono', monospace; color: #F06FB0">{{r.t}}</span></span><input type="range" min="0" max="1" step="0.01" value="{{r.tVal}}" onChange="{{set.slerpT}}"></label>
<div style="display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">Angle Ω between A and B</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.omega}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="display: flex; align-items: center; gap: 8px; color: #A3ADBF"><span style="width: 10px; height: 10px; border-radius: 5px; background: #F06FB0"></span>slerp angle (t · Ω)</span><span style="font-family: 'JetBrains Mono', monospace; color: #F06FB0; font-weight: 600">{{r.sAng}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px"><span style="display: flex; align-items: center; gap: 8px; color: #A3ADBF"><span style="width: 10px; height: 10px; border-radius: 5px; background: #8C97AB"></span>plain lerp length</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.lLen}}</span></div>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.55; color: #A3ADBF"><strong style="color: #E6EAF2; font-weight: 600">Used for</strong> rotating a turret or camera toward a target at steady speed, blending orientations between animation keyframes.</p>
</div>
</sc-if>

<sc-if value="{{is.inv}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #F06FB0">07 · Inverse lerp</p>
<h2 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; color: #F2F4F8">Given a point, how far along is it?</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #B4BDCC">Inverse lerp undoes lerp. Lerp takes a fraction t and gives you a point between A and B; inverse lerp takes the point V and gives you back t, from 0 at A to 1 at B. Drag the ends to reshape the line, then drag the pink handle along it and watch t on the scale below.</p>
</div>
<div style="margin: 0; padding: 14px 16px; background: #0B0F16; border: 1px solid #232B3A; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.75; color: #E6EAF2; white-space: pre-line">t = invLerp(A, B, V)
  = |V − A| / |B − A|
1D:  t = (v − a) / (b − a)
lerp(A, B, invLerp(A, B, V)) = V</div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #A3ADBF"><span style="display: flex; justify-content: space-between"><span>Position of V</span><span style="font-family: 'JetBrains Mono', monospace; color: #F06FB0">{{r.t}}</span></span><input type="range" min="0" max="1" step="0.01" value="{{r.tVal}}" onChange="{{set.invT}}"></label>
<div style="display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">A (t = 0)</span><span style="font-family: 'JetBrains Mono', monospace; color: #F5B83D">{{r.A}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">B (t = 1)</span><span style="font-family: 'JetBrains Mono', monospace; color: #5AB8F5">{{r.B}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">V</span><span style="font-family: 'JetBrains Mono', monospace; color: #F06FB0">{{r.V}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">|V − A| / |B − A|</span><span style="font-family: 'JetBrains Mono', monospace; color: #B4BDCC">{{r.ratio}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1F2635; font-size: 14px"><span style="color: #A3ADBF">Inverse lerp t</span><span style="font-family: 'JetBrains Mono', monospace; color: #5EE0A8; font-weight: 600">{{r.t}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px"><span style="color: #A3ADBF">Same with x only: invLerp(Ax, Bx, Vx)</span><span style="font-family: 'JetBrains Mono', monospace; color: #B4BDCC; text-align: right">{{r.oneD}}</span></div>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.55; color: #A3ADBF"><strong style="color: #E6EAF2; font-weight: 600">Used for</strong> turning distance into a fade-out amount, progress along a path or timeline, mapping a joystick dead zone, and remapping one range onto another.</p>
</div>
</sc-if>

<sc-if value="{{is.gimbal}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #F06FB0">08 · Gimbal lock</p>
<h2 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; color: #F2F4F8">Why three angles are not enough</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #B4BDCC">Euler angles rotate in a fixed order: yaw around the world’s up axis, then pitch, then roll around the object’s own nose. Each ring shows one of those rotations. Pitch the nose straight up to 90° and the pink roll ring swings into the same plane as the amber yaw ring. Yaw and roll now spin the object around the same axis, and one direction of rotation is gone until you pitch back down.</p>
</div>
<div style="margin: 0; padding: 14px 16px; background: #0B0F16; border: 1px solid #232B3A; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.75; color: #E6EAF2; white-space: pre-line">R = Rz(yaw) · Ry(pitch) · Rx(roll)
roll axis = R · (1, 0, 0)
pitch = ±90° → roll axis ∥ yaw axis</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #A3ADBF"><span style="display: flex; justify-content: space-between"><span>Yaw (outer ring)</span><span style="font-family: 'JetBrains Mono', monospace; color: #F5B83D">{{r.yaw}}</span></span><input type="range" min="-180" max="180" step="1" value="{{r.yawVal}}" onChange="{{set.gYaw}}"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #A3ADBF"><span style="display: flex; justify-content: space-between"><span>Pitch (middle ring)</span><span style="font-family: 'JetBrains Mono', monospace; color: #5AB8F5">{{r.pitch}}</span></span><input type="range" min="-90" max="90" step="1" value="{{r.pitchVal}}" onChange="{{set.gPitch}}"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #A3ADBF"><span style="display: flex; justify-content: space-between"><span>Roll (inner ring)</span><span style="font-family: 'JetBrains Mono', monospace; color: #F06FB0">{{r.roll}}</span></span><input type="range" min="-180" max="180" step="1" value="{{r.rollVal}}" onChange="{{set.gRoll}}"></label>
<button type="button" onClick="{{toggleLock}}" style="align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #2E3748; background: #1A2030; color: #E6EAF2; font-size: 14px; font-weight: 600; cursor: pointer">{{r.lockBtn}}</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #A3ADBF"><span>Yaw and roll axis alignment |yaw · roll|</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.align}}</span></div>
<div style="position: relative; height: 12px; border-radius: 6px; background: #0B0F16; border: 1px solid #232B3A">
<div style="position: absolute; top: 1px; left: 0; width: {{r.alignPct}}%; height: 10px; border-radius: 5px; background: {{r.alignColor}}"></div>
</div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px"><span style="color: #A3ADBF">Independent rotation axes</span><span style="font-family: 'JetBrains Mono', monospace; color: #F2F4F8">{{r.dof}}</span></div>
</div>
<p style="margin: 0; padding: 12px 14px; border-radius: 10px; background: {{r.noteBg}}; color: {{r.noteFg}}; font-size: 14px; line-height: 1.5">{{r.note}}</p>
<p style="margin: 0; font-size: 13px; line-height: 1.55; color: #A3ADBF"><strong style="color: #E6EAF2; font-weight: 600">Why it matters</strong> cameras clamp pitch to ±89°, interpolating Euler angles near the lock flips wildly, and it is the main reason engines store orientation as quaternions.</p>
</div>
</sc-if>

<sc-if value="{{is.quat}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #F06FB0">09 · Quaternions</p>
<h2 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; color: #F2F4F8">A rotation packed into four numbers</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #B4BDCC">A unit quaternion stores an axis u and an angle θ: the vector part is the axis scaled by sin(θ/2), the scalar part is cos(θ/2). It rotates the cube around the amber axis with no gimbal lock, composes by multiplication and slerps smoothly. Notice the half angle: after one full turn q has become −q, which is the same orientation. It takes 720° to get back to the same numbers.</p>
</div>
<div style="margin: 0; padding: 14px 16px; background: #0B0F16; border: 1px solid #232B3A; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.75; color: #E6EAF2; white-space: pre-line">q = (w, x, y, z)
  = (cos θ⁄2,  u · sin θ⁄2)
v′ = q v q⁻¹      |q| = 1</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #A3ADBF"><span style="display: flex; justify-content: space-between"><span>Angle θ</span><span style="font-family: 'JetBrains Mono', monospace; color: #F06FB0">{{r.angle}}</span></span><input type="range" min="0" max="720" step="1" value="{{r.angleVal}}" onChange="{{set.qAngle}}"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #A3ADBF"><span style="display: flex; justify-content: space-between"><span>Axis heading</span><span style="font-family: 'JetBrains Mono', monospace; color: #F5B83D">{{r.yaw}}</span></span><input type="range" min="0" max="360" step="1" value="{{r.yawVal}}" onChange="{{set.qYaw}}"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #A3ADBF"><span style="display: flex; justify-content: space-between"><span>Axis elevation</span><span style="font-family: 'JetBrains Mono', monospace; color: #F5B83D">{{r.pitch}}</span></span><input type="range" min="-90" max="90" step="1" value="{{r.pitchVal}}" onChange="{{set.qPitch}}"></label>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #A3ADBF"><span>Axis u</span><span style="font-family: 'JetBrains Mono', monospace; color: #F5B83D">{{r.axis}}</span></div>
<sc-for list="{{r.comps}}" as="c" hint-placeholder-count="4">

      hint: 'Drag the player and the enemy', title: 'dir = (enemy − player) / |enemy − player|' });

    }).filter((f) => f.depth < 0).sort((p, q) => q.avg - p.avg).forEach((f) => this.Po(sc, f.pts, f.fill, 1, '#0B0F16', 1.5));
    this.Ar(sc, P(this.mul3(u, 1.75)), P(this.mul3(u, 2.75)), C.A, 3);
    this.Tx(sc, P(this.mul3(u, 3.05)), 'axis u', C.A, 13);
    const comp = (name, val, color) => ({ name, val: this.f2(val), color, left: (val >= 0 ? 50 : 50 + val * 50).toFixed(1), w: Math.max(0.6, Math.abs(val) * 50).toFixed(1) });
    const second = s.qAngle >= 360;
    Object.assign(r, { angle: s.qAngle.toFixed(0) + '°', angleVal: Math.round(s.qAngle), yaw: s.qYaw.toFixed(0) + '°', yawVal: s.qYaw, pitch: s.qPitch.toFixed(0) + '°', pitchVal: s.qPitch,
      axis: this.vs3(u), comps: [comp('w', w, '#E6EAF2'), comp('x', qv[0], C.R), comp('y', qv[1], C.B), comp('z', qv[2], C.A)],
      norm: Math.hypot(w, qv[0], qv[1], qv[2]).toFixed(3),
      note: second ? 'Second lap (θ > 360°): every component has flipped sign compared with the first lap, yet the cube looks identical. q and −q are the same rotation.' : 'First lap (θ < 360°). Watch w: it starts at 1, passes 0 at 180° and reaches −1 at 360°.',
      noteBg: second ? '#2A1A22' : '#1A2030', noteFg: second ? '#F7B6D3' : '#C9D1E0',
      hint: 'Sliders set axis and angle · colored faces are +x, +y, +z', title: 'q = (cos θ⁄2, u sin θ⁄2)' });
  }

  renderVals() {
    const s = this.state, topic = this.topicOf(), sc = this.sc(), r = {};
    const map = { dir: 'sceneDir', norm: 'sceneNorm', dot: 'sceneDot', cross: 'sceneCross', lerp: 'sceneLerp', slerp: 'sceneSlerp', inv: 'sceneInv', gimbal: 'sceneGimbal', quat: 'sceneQuat' };
    this[map[topic] || 'sceneDir'](sc, r);
    const topics = [['dir', '01', 'Directions'], ['norm', '02', 'Normalize'], ['dot', '03', 'Dot product'], ['cross', '04', 'Cross product'], ['lerp', '05', 'Lerp'], ['slerp', '06', 'Slerp'], ['inv', '07', 'Inverse lerp'], ['gimbal', '08', 'Gimbal lock'], ['quat', '09', 'Quaternions']];
    const tabs = topics.map(([id, num, label]) => {
      const on = id === topic;
      return { id, num, label, pressed: on, bg: on ? '#F06FB0' : 'transparent', fg: on ? '#0E1117' : '#C9D1E0', bd: on ? '#F06FB0' : '#2A3344', pick: () => this.setState({ topic: id, drag: null }) };
    });
    const num = (key) => (e) => this.setState({ [key]: parseFloat(e.target.value) });
    const numPause = (key) => (e) => this.setState({ [key]: parseFloat(e.target.value), playing: false });
    const setZ = (key) => (e) => { const v = this.state[key], hd = Math.atan2(v[1], v[0]), el = parseFloat(e.target.value) * Math.PI / 180; this.setState({ [key]: [Math.cos(el) * Math.cos(hd), Math.cos(el) * Math.sin(hd), Math.sin(el)] }); };
    const gLocked = Math.abs(Math.cos(s.gPitch * Math.PI / 180)) < 0.035;
    const is = {}; topics.forEach(([id]) => { is[id] = id === topic; });
    return {
      tabs, is, r, scene: sc,
      stageTitle: r.title, hint: r.hint,
      playing: s.playing, paused: !s.playing, playText: s.playing ? 'Pause' : 'Play', playLabel: s.playing ? 'Pause animation' : 'Play animation',
      togglePlay: () => this.setState({ playing: !s.playing }),
      reset: () => { const d = this.defaults(); d.topic = s.topic; d.playing = s.playing; this.setState(d); },
      onMove: this.onMove, onUp: this.onUp,
      swapCross: () => this.setState({ crossSwap: !s.crossSwap }),
      easeLinear: () => this.setState({ lerpEase: 'linear' }),
      easeSmooth: () => this.setState({ lerpEase: 'smooth' }),
      toggleLock: () => this.setState({ gPitch: gLocked ? 20 : 90 }),
      set: { crossAz: setZ('crossA'), crossBz: setZ('crossB'), crossYaw: (e) => this.setState({ crossYaw: parseFloat(e.target.value) * Math.PI / 180 }),
        gYaw: num('gYaw'), gPitch: num('gPitch'), gRoll: numPause('gRoll'), lerpT: numPause('lerpT'), slerpT: numPause('slerpT'), invT: numPause('invT'), qAngle: numPause('qAngle'), qYaw: num('qYaw'), qPitch: num('qPitch') }
    };
  }
}

const params = new URLSearchParams(location.search);
const props = {"speed": 1, "showGrid": true, "startTopic": "dir"};
if (params.get('topic')) props.startTopic = params.get('topic');
if (params.get('speed')) props.speed = parseFloat(params.get('speed')) || props.speed;
if (params.get('grid') === '0') props.showGrid = false;
mount(Component, props);
</script>
</body>
